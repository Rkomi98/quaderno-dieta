<style>
/* Layout: quaderno a pagine singole, indice a schede ruotate, una ricetta per pagina, lista della spesa in fondo */

}

  --brick:#e0846a; --olive:#b2c27a; --mustard:#e6b85a; --brick-soft:rgba(224,132,106,.14); --olive-soft:rgba(178,194,122,.14); --mustard-soft:rgba(230,184,90,.14);

:root[data-theme="dark"]{

  --brick:#e0846a; --olive:#b2c27a; --mustard:#e6b85a; --brick-soft:rgba(224,132,106,.14); --olive-soft:rgba(178,194,122,.14); --mustard-soft:rgba(230,184,90,.14);
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.35); color-scheme:dark}

.wrap{max-width:860px;margin:0 auto}

h2{font-size:clamp(1.6rem,4.5vw,2.2rem)}

p{margin:0}
a{color:var(--brick)}
button{font:inherit;color:inherit}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px dashed var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;cursor:pointer}
.tab[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pers{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2)}

.page{padding-top:28px}

.day:hover{transform:rotate(0deg) translateY(-3px)}
.day h3{font-size:1.45rem;margin-bottom:14px}
.day .tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--olive);margin-left:6px;font-family:var(--body);font-style:normal}

.away{font-size:.92rem;color:var(--ink-2)}
.pill{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;margin-left:4px;vertical-align:2px}
.p-pesce{background:rgba(70,120,160,.14);color:#3d6c8f}

.p-formaggio{background:var(--mustard-soft);color:#8c6514}
.p-nessuna{background:var(--paper-2);color:var(--ink-2)}

.extra{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:18px}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}

.rhead{display:grid;gap:10px;margin-bottom:18px}

.src{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.92rem}

.note.warn{border-color:var(--mustard);background:var(--mustard-soft)}

.ing{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:var(--shadow);transform:rotate(-.6deg)}

.chk input:checked{background:var(--olive);border-color:var(--olive)}

.chk input:checked + span{text-decoration:line-through;color:var(--ink-2)}
.qty{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{height:10px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;margin:4px 0 6px}
.progress i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--brick),var(--brick) 6px,var(--mustard) 6px,var(--mustard) 12px);transition:width .3s ease}
.plabel{font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-bottom:10px}
.steps ol{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;transition:background .15s}
.step::before{counter-increment:s;content:counter(s);font-family:var(--display);font-style:italic;font-weight:600;font-size:1.25rem;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--brick);color:var(--brick);display:grid;place-content:center;line-height:1}

.side{margin-top:14px;font-size:.95rem}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--card);border-radius:4px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.9rem}

.ghost{border:0;background:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:0}

/* pagine di testo */
.prose{display:grid;gap:16px;max-width:66ch}
.prose h3{margin-top:6px}

/* spesa */
.shop{display:grid;gap:22px;margin-top:20px}
.shopgrp{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:16px 18px}
.shopgrp:nth-child(odd){transform:rotate(-.4deg)}
.shopgrp:nth-child(even){transform:rotate(.4deg)}
.shopgrp h3{margin-bottom:4px}
.cat{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--olive);margin:14px 0 2px}
.days-small{font-size:.78rem;color:var(--ink-2);margin-left:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.day,.ing,.shopgrp{transform:none!important}}
</style>

function fmtNum(q,u){
  if(q===null)return "";
  if(["g","ml"].includes(u)){const v=q<50?Math.max(5,Math.round(q/5)*5):Math.round(q/10)*10;if(v>=1000)return (v/1000).toLocaleString("it-IT",{maximumFractionDigits:2})+(u==="g"?" kg":" l");return v+" "+u}
  if(u==="l"){return (Math.round(q*20)/20).toLocaleString("it-IT")+" l"}
  if(u==="pz"||u==="cucchiaino"){const h=Math.max(.5,Math.ceil(q*2)/2);const w=Math.floor(h),f=h-w;let s=(w?w:"")+(f?(w?" ½":"½"):"");return u==="pz"?s:s+" "+(h>1?"cucchiaini":"cucchiaino")}
  const n=Math.max(1,Math.ceil(q));
  const pl={spicchio:"spicchi",rametto:"rametti",costa:"coste",ciuffo:"ciuffi"};
  return n+" "+(n>1&&pl[u]?pl[u]:u);
}
function fmtIng(i,f){const [n,q,u]=i;if(q===null)return "q.b.";const k=q*f;if(n==="Uova"||n==="Uovo")return Math.max(1,Math.ceil(k))+"";if(u==="g"&&/Lievito/.test(n))return (Math.round(k*10)/10).toLocaleString("it-IT")+" g";return fmtNum(k,u)}

  h+=`</div><div class="steps"><h3>Procedimento</h3><div class="progress" aria-hidden="true"><i id="bar-${r.id}"></i></div><p class="plabel" id="pl-${r.id}"></p><ol>`;
  r.steps.forEach((s,n)=>{h+=`<li class="step" data-step="${r.id}-s${n}" tabindex="0" role="checkbox" aria-checked="false"><p>${esc(s)}</p></li>`});
  h+=`</ol><p class="side" style="font-size:.85rem;color:var(--ink-2)">Tocca un passaggio quando l'hai fatto. Le quantità nei passaggi sono quelle della ricetta originale.</p><div style="margin-top:6px"><button class="ghost" data-reset="${r.id}">Ricomincia da capo</button></div>${r.side?`<div class="note warn" style="margin-top:14px">${r.side}</div>`:""}</div></div>
  <div class="pager"><button class="btn" data-go="${prev}">← ${esc(label(prev))}</button><button class="btn" data-go="${next}">${esc(label(next))} →</button></div></section>`;
  return h;
}

function aggregate(list){
  const m=new Map();
  list.forEach(r=>{const f=persone/r.base;r.ing.forEach(i=>{
    const [n,q,u,key,cat,sq,su]=i; if(cat==="none")return;
    const qq=sq!=null?sq:q, uu=su!=null?su:u;
    const id=cat+"|"+key;
    if(!m.has(id))m.set(id,{key,cat,units:{},days:new Set(),qb:false});
    const e=m.get(id); e.days.add(r.day);
    if(qq===null||cat==="qb"){e.qb=true;return}
    e.units[uu]=(e.units[uu]||0)+qq*f;
  })});
  return m;
}
function renderSpesa(){
  const dl={lun:"lun",mer:"mer",gio:"gio",ven:"ven",sab:"sab",dom:"dom"};
  const groups=[["Prima di partire","Per il pranzo di lunedì.",R.filter(r=>r.day==="lun"),"g1"],["Al rientro da Siena","Per i pasti da mercoledì sera a domenica. Il salmone compralo il giorno prima o la mattina stessa; i gamberi vanno bene anche surgelati.",R.filter(r=>r.day!=="lun"),"g2"]];
  let h=`<section class="page"><p class="eyebrow">Ultima pagina</p><h1>Lista della spesa</h1><p class="lead">Quantità per ${persone} ${persone>1?"persone":"persona"}, sommate da tutte le ricette e arrotondate. Accanto a ogni voce i giorni in cui serve.</p><div class="shop">`;
  groups.forEach(([t,s,list,gk])=>{
    const m=aggregate(list);
    h+=`<div class="shopgrp"><h3>${t}</h3><p class="sub" style="margin:0">${s}</p>`;
    CATS.forEach(([c,cl])=>{
      const items=[...m.values()].filter(e=>e.cat===c).sort((a,b)=>a.key.localeCompare(b.key,"it"));
      if(!items.length)return;
      h+=`<p class="cat">${cl}</p>`;
      items.forEach(e=>{
        const amt=Object.entries(e.units).map(([u,q])=>e.key==="Uova"?Math.ceil(q)+"":fmtNum(q,u)).join(" + ");
        const days=[...e.days].map(d=>dl[d]).join(", ");
        h+=`<label class="chk"><input type="checkbox" data-k="spesa-${gk}-${esc(e.cat+e.key)}"><span>${esc(e.key)}${amt?` <span class="qty">${amt}</span>`:""}<span class="days-small">${days}</span></span></label>`;
      });
    });
    h+=`</div>`;
  });
  h+=`<div class="shopgrp"><h3>Colazioni e spuntini</h3><p class="sub" style="margin:0">Per tutta la settimana, nelle quantità che usi di solito.</p>`;
  ["Bevanda vegetale senza zuccheri aggiunti","Yogurt intero senza lattosio","Fiocchi d'avena","Biscotti","Frutta secca","Pane integrale","Marmellata","Miele","Cereali soffiati","Farina integrale per i pancake","Mele, pere, cachi, mandarini e kiwi"].forEach((x,n)=>{h+=`<label class="chk"><input type="checkbox" data-k="spesa-col-${n}"><span>${x}</span></label>`});
  h+=`</div></div><div class="pager"><button class="btn" data-go="pizza">← Pizza Margherita</button><button class="btn" data-go="indice">Torna alla settimana</button></div><div style="margin-top:12px"><button class="ghost" data-resetshop="1">Togli tutte le spunte della spesa</button></div></section>`;
  return h;
}

function updateProgress(id){
  const steps=[...app.querySelectorAll(`[data-step^="${id}-s"]`)];
  const done=steps.filter(s=>s.classList.contains("done")).length;
  const bar=document.getElementById("bar-"+id),pl=document.getElementById("pl-"+id);
  if(bar)bar.style.width=(steps.length?done/steps.length*100:0)+"%";
  if(pl)pl.textContent=done===steps.length?`Fatto: ${done} passaggi su ${steps.length}. Buon appetito.`:`${done} passaggi su ${steps.length}`;
}

function show(p){
  if(!PAGES.includes(p))p="indice";
  let h;
  if(p==="indice")h=renderIndice();else if(p==="colazione")h=renderColazione();else if(p==="siena")h=renderSiena();else if(p==="spesa")h=renderSpesa();else h=renderRicetta(byId(p));
  app.innerHTML=h;
  app.querySelectorAll("input[data-k]").forEach(c=>{c.checked=!!store.get("c:"+c.dataset.k,false)});
  app.querySelectorAll("[data-step]").forEach(s=>{const d=!!store.get("c:"+s.dataset.step,false);s.classList.toggle("done",d);s.setAttribute("aria-checked",d)});
  const r=byId(p); if(r)updateProgress(r.id);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.go===p?"true":"false"));
  store.set("page",p); current=p;
  window.scrollTo({top:0});
}
let current="indice";

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){show(g.dataset.go);return}
  const pb=e.target.closest("[data-p]"); if(pb){persone=+pb.dataset.p;store.set("persone",persone);document.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed",b===pb?"true":"false"));show(current);return}
  const st=e.target.closest("[data-step]"); if(st){toggleStep(st);return}
  const rs=e.target.closest("[data-reset]"); if(rs){const id=rs.dataset.reset;const r=byId(id);r.steps.forEach((_,n)=>store.set("c:"+id+"-s"+n,false));r.ing.forEach((_,n)=>store.set("c:"+id+"-i"+n,false));show(id);return}
  const rsp=e.target.closest("[data-resetshop]"); if(rsp){app.querySelectorAll('input[data-k^="spesa-"]').forEach(c=>{c.checked=false;store.set("c:"+c.dataset.k,false)});return}
});
document.addEventListener("change",e=>{const c=e.target.closest("input[data-k]");if(c)store.set("c:"+c.dataset.k,c.checked)});
document.addEventListener("keydown",e=>{const st=e.target.closest&&e.target.closest("[data-step]");if(st&&(e.key===" "||e.key==="Enter")){e.preventDefault();toggleStep(st)}});
function toggleStep(st){const d=!st.classList.contains("done");st.classList.toggle("done",d);st.setAttribute("aria-checked",d);store.set("c:"+st.dataset.step,d);updateProgress(st.dataset.step.split("-s")[0])}

document.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.p===persone?"true":"false"));
show(store.get("page","indice"));
})();
</script>

</body></html>
