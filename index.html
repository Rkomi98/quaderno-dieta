  <style>

  /* pagine di testo */
  .prose{display:grid;gap:16px;max-width:66ch}

  /* spesa */

   lact:"Nessun latticino.",
   extra:"Compra i filetti di merluzzo freschi dal pescivendolo, mai in scatola.",
   ing:[["Filetti di merluzzo fresco",800,"g","Merluzzo fresco, filetti","pesce"],["Patate",800,"g","Patate","verd"],["Aglio",1,"spicchio","Aglio","verd"],["Vino bianco secco",120,"ml","Vino bianco secco","disp"],["Prezzemolo",null,"q.b.","Prezzemolo","erbe"],["Olio extravergine e sale",null,"q.b.","Olio extravergine d'oliva","qb"]],
   steps:["Sbuccia le patate e tagliale a fettine sottili.","Sbollentale in acqua salata per 5 minuti, poi scolale.","Trita finemente l'aglio. Rivesti due teglie con carta forno e spennella la parte centrale con olio.","Nella prima teglia disponi uno strato di patate leggermente sovrapposte, a formare un rettangolo abbastanza grande per due filetti, e adagiaci sopra due filetti di merluzzo.","Cospargi i filetti di aglio e prezzemolo tritati e irrorali con il vino bianco.","Sala, copri con altre patate, condisci con un pizzico di sale e un filo d'olio. Ripeti nella seconda teglia con gli altri due filetti.","Completa con altro prezzemolo tritato e cuoci in forno statico preriscaldato a 180 °C per 25-30 minuti, finché le patate sono dorate e il pesce ben cotto.","Sforna e servi ben caldo."],
   side:"Mentre il forno lavora ti restano libere le mani per falafel e frittata: vedi la pagina dedicata a ufficio e allenamento."},
  {id:"falafel",day:"mer",dayL:"Mercoledì 25",meal:"Pranzo in ufficio",title:"Felafel con hummus veloce e salsa allo yogurt",prot:"legumi",base:4,
   url:"https://ricette.giallozafferano.it/Felafel-con-hummus-veloce-e-salsa-allo-yogurt.html",time:"40 minuti, più 24 ore di ammollo dei ceci",start:"Ceci in ammollo lunedì sera. Martedì sera, mentre il merluzzo è in forno, impasta e friggi. Mercoledì porta felafel, hummus e salsa in contenitori separati.",
   lact:"Hummus (200 g) e salsa (100 g) usano yogurt greco: sostituiscilo con yogurt senza lattosio o di soia.",
   extra:"I felafel si conservano 2-3 giorni in frigo in contenitore ermetico, hummus e salsa altrettanto (la salsa al massimo 1-2 giorni). Variante mia, non della ricetta: se non vuoi friggere, cuoci i felafel in forno a 200 °C per 20-25 minuti, girandoli a metà.",
   ing:[["Ceci secchi, in ammollo 24 ore",500,"g","Ceci secchi","disp"],["Cipolla bianca piccola",1,"pz","Cipolle bianche","verd",100,"g"],["Aglio",2,"spicchio","Aglio","verd"],["Cumino",1,"cucchiaino","Cumino","disp"],["Prezzemolo",2,"ciuffo","Prezzemolo","erbe"],["Ceci precotti, per l'hummus",300,"g","Ceci precotti","disp"],["Tahina",100,"g","Tahina","disp"],["Yogurt senza lattosio o di soia, per l'hummus",200,"g","Yogurt senza lattosio, greco o di soia","latt"],["Tabasco",10,"goccia","Tabasco","disp"],["Paprika affumicata",1,"pizzico","Paprika affumicata","disp"],["Yogurt senza lattosio o di soia, per la salsa",100,"g","Yogurt senza lattosio, greco o di soia","latt"],["Menta",1,"ciuffo","Menta","erbe"],["Limone, per il succo",0.5,"pz","Limoni","verd"],["Olio di semi, per friggere",1,"l","Olio di semi","disp"],["Olio extravergine, sale, pepe",null,"q.b.","Olio extravergine d'oliva","qb"],["Pane pita o pane integrale, per accompagnare",200,"g","Pane","pane"]],
   steps:["Hummus: nel mixer metti i ceci precotti, il prezzemolo, lo yogurt e la tahina.","Regola di sale e pepe, aggiungi la paprika affumicata e il Tabasco.","Frulla fino a una crema densa e omogenea e trasferiscila in una ciotolina.","Salsa: spremi il limone e aggiungi il succo allo yogurt in una ciotolina, poi unisci la menta grossolanamente sminuzzata.","Condisci la salsa con olio, pepe e sale e mescola.","Felafel: scola i ceci tenuti in ammollo in acqua fredda per 24 ore e lasciali asciugare stesi su un panno pulito.","Pela la cipolla e tagliala a grossi pezzi. Sbuccia l'aglio, elimina il germe e tagliarlo a pezzetti.","Nel mixer frulla i ceci asciutti con cipolla, aglio e cumino fino a un composto omogeneo.","Unisci il prezzemolo finemente tritato, regola di pepe e sale e mescola.","Trasferisci il composto in una pirofila bassa e larga, copri con pellicola e lascia riposare in frigo per mezz'ora.","Con un cucchiaio preleva una piccola porzione e lavorala tra le mani inumidite per formare polpette piccole, rotonde e leggermente schiacciate (ne escono circa 15).","Porta l'olio di semi a una temperatura tra 165 e 180 °C, meglio con un termometro da cucina.","Immergi i felafel pochi per volta e friggili per circa 1 minuto, girandoli spesso per una doratura uniforme.","Scolali su carta assorbente. Per il pranzo in ufficio lasciali raffreddare prima di chiuderli nel contenitore."],
   side:"In ufficio puoi mangiarli freddi dentro una pita con hummus e salsa."},
  {id:"frittata",day:"mer",dayL:"Mercoledì 25",meal:"Cena, 19:30",title:"Frittata di spinaci",prot:"uova",base:4,
   url:"https://ricette.giallozafferano.it/Frittata-di-spinaci.html",time:"35 minuti",start:"Preparala martedì sera mentre il merluzzo cuoce. Mercoledì la scaldi cinque minuti in padella coperta o la mangi tiepida: a tavola alle 19:30, finito intorno alle 20:00.",
   lact:"Il Parmigiano è naturalmente privo di lattosio. Non aggiungere il burro che la redazione propone nei commenti.",
   extra:"Sera di allenamento: la cena è tutto quello che mangi prima delle 21, quindi accompagna la frittata con pane integrale o patate al forno, per avere i carboidrati. La pagina nel procedimento cita uno spicchio d'aglio in camicia che non compare tra gli ingredienti: l'ho aggiunto in lista.",
   ing:[["Uova",6,"pz","Uova","uova"],["Spinaci",350,"g","Spinaci","verd"],["Parmigiano Reggiano grattugiato",50,"g","Parmigiano Reggiano","latt"],["Aglio, in camicia",1,"spicchio","Aglio","verd"],["Olio extravergine",5,"cucchiaio","Olio extravergine d'oliva","qb"],["Sale e pepe",null,"q.b.","Sale e pepe","qb"],["Pane integrale, per accompagnare",250,"g","Pane","pane"]],
   steps:["Lava e pulisci gli spinaci eliminando i gambi più duri. In una padella da 20-22 cm fai soffriggere per un paio di minuti uno spicchio d'aglio in camicia con un giro d'olio, poi aggiungi gli spinaci e saltali per una decina di minuti.","Sala leggermente, spegni il fuoco, togli l'aglio e lascia intiepidire.","Scola gli spinaci, strizzali con cura e tritali al coltello.","Rompi le uova in una ciotola, aggiungi il Parmigiano, un pizzico di pepe e un pizzico di sale.","Sbatti con le fruste o con una forchetta finché tuorli e albumi sono completamente amalgamati.","Aggiungi gli spinaci al composto e mescola velocemente.","Scalda un giro d'olio nella stessa padella, versa il composto e cuoci con il coperchio a fuoco dolce per circa 10 minuti.","Quando la superficie comincia a rapprendersi, gira la frittata aiutandoti con un piatto piano, un coperchio o una spatola larga, e cuoci altri 5 minuti circa, finché è dorata.","Servi ancora calda; se l'hai fatta il giorno prima, scaldala in padella coperta."],
   side:"Se usi spinaci surgelati, scolali e strizzali bene dopo la cottura: rilasciano molta più acqua."},
  {id:"vongole",day:"gio",dayL:"Giovedì 26",meal:"Pranzo",title:"Spaghetti alle vongole",prot:"pesce",base:4,
   url:"https://ricette.giallozafferano.it/Spaghetti-alle-vongole.html",time:"40 minuti, più 2-3 ore di spurgo",start:"Per pranzare alle 13: vongole a spurgare verso le 10, poi comincia alle 12:20.",
   lact:"Nessun latticino.",
   extra:"Chiedi vongole veraci freschissime. Per un tocco piccante la pagina suggerisce un peperoncino tritato nel soffritto d'aglio, e a fine cottura scorza di limone o bottarga.",
   ing:[["Spaghetti grossi",320,"g","Spaghetti grossi","pasta"],["Vongole",1,"kg","Vongole veraci","pesce"],["Aglio",1,"spicchio","Aglio","verd"],["Prezzemolo",1,"mazzetto","Prezzemolo","erbe"],["Sale grosso, per lo spurgo",null,"q.b.","Sale grosso","qb"],["Olio extravergine, sale, pepe",null,"q.b.","Olio extravergine d'oliva","qb"]],
   steps:["Pulisci le vongole e scarta quelle con il guscio rotto o vuoto. Battile contro il lavandino o su un tagliere: quelle sane restano chiuse, quelle piene di sabbia si aprono.","Mettile in una ciotola, sciacquale e aggiungi il sale grosso.","Lasciale in ammollo per 2-3 ore, poi scolale e sciacquale di nuovo.","In un tegame scalda un po' d'olio e fai imbiondire uno spicchio d'aglio.","Versa le vongole nel tegame caldo, copri e cuoci qualche minuto a fiamma alta, agitando di tanto in tanto, finché si sono aperte tutte. Intanto trita finemente il prezzemolo.","Appena sono tutte aperte spegni subito il fuoco, per non farle cuocere troppo.","Cuoci gli spaghetti in abbondante acqua leggermente salata per metà del tempo indicato sulla confezione.","Intanto filtra le vongole in una ciotola sottostante, eliminando l'aglio, e versa nel tegame il liquido di cottura raccolto.","Scola gli spaghetti conservando un po' d'acqua di cottura e trasferiscili nel tegame con il condimento.","Aggiungi un mestolo d'acqua di cottura, regola di pepe e termina la cottura, aggiungendo altra acqua se serve.","A pasta pronta unisci le vongole, il prezzemolo, salta brevemente e servi subito."],
   side:"Non salare troppo l'acqua della pasta: le vongole sono già sapide."},
  {id:"risotto",day:"gio",dayL:"Giovedì 26",meal:"Cena, 19:15",title:"Risotto giallo ai finferli",prot:"nessuna",base:4,
   url:"https://ricette.giallozafferano.it/Risotto-giallo-ai-finferli.html",time:"35 minuti",start:"Per cenare alle 19:15, comincia alle 18:40. A tavola finisci verso le 19:45, più di un'ora prima dell'allenamento.",
   lact:"La ricetta usa 80 g di burro: sostituiscilo con olio extravergine (qui 40 g in tutto). Il Grana Padano stagionato ha tracce di lattosio trascurabili; se vuoi essere rigoroso usa Parmigiano.",
   extra:"Sera di allenamento: carboidrati e poche proteine, tutto prima delle 21. I finferli sono i gallinacci che ti piacciono, nessun altro fungo. A fine novembre quelli freschi nel Nord sono rari: vanno benissimo i surgelati di buona qualità.",
   ing:[["Riso Carnaroli",320,"g","Riso Carnaroli","pasta"],["Funghi finferli (gallinacci)",400,"g","Finferli (gallinacci), freschi o surgelati","verd"],["Cipolla bianca",1,"pz","Cipolle bianche","verd",100,"g"],["Olio extravergine, al posto del burro",40,"g","Olio extravergine d'oliva","qb"],["Grana Padano grattugiato",50,"g","Grana Padano","latt"],["Brodo vegetale",1,"l","Brodo vegetale (o carota, sedano e cipolla per farlo)","disp"],["Zafferano",1,"bustina","Zafferano","disp"],["Sale e pepe",null,"q.b.","Sale e pepe","qb"]],
   steps:["Lava i funghi sotto l'acqua corrente, asciugali con un canovaccio e dividi a metà quelli più grandi.","Stufa i finferli in padella con metà dell'olio per qualche minuto e sala leggermente.","In una pentola capiente scalda l'altra metà dell'olio e fai dorare la cipolla tritata finemente.","Aggiungi il riso e tostalo per qualche minuto, girando per non farlo attaccare.","Sfuma con il brodo, aggiungendo un mestolo di tanto in tanto.","Dopo 10 minuti unisci lo zafferano e prosegui la cottura aggiungendo brodo e mescolando.","A cottura quasi ultimata unisci i funghi e aggiusta di sale.","Completa con una spolverata di pepe e, a fuoco spento, manteca con il Grana Padano.","Servi caldo."],
   side:"Se hai ancora fame verso le 20:20, mezz'ora prima di iniziare, basta una banana o una fetta di pane con miele."},
  {id:"fagioli",day:"ven",dayL:"Venerdì 27",meal:"Pranzo",title:"Pasta e fagioli",prot:"legumi",base:4,
   url:"https://ricette.giallozafferano.it/Pasta-e-fagioli.html",time:"2 ore e 5 minuti, più l'ammollo notturno",start:"Borlotti in ammollo giovedì sera; venerdì comincia alle 10:55 per pranzare alle 13.",
   lact:"Nessun latticino.",
   extra:"Ho tolto lardo e prosciutto crudo (80 g l'uno nella ricetta) per tenere i salumi a una sola occasione. Il sapore lo fanno il soffritto ben dorato e il rosmarino; a fine piatto, olio crudo e pepe. Dalla pagina: coi cannellini al posto dei borlotti va benissimo; i borlotti surgelati cuociono circa 20 minuti e non vogliono ammollo.",
   ing:[["Ditaloni rigati",320,"g","Ditaloni rigati","pasta"],["Fagioli borlotti secchi",200,"g","Fagioli borlotti secchi","disp"],["Passata di pomodoro",250,"g","Passata di pomodoro","disp"],["Cipolla",30,"g","Cipolle dorate","verd"],["Sedano",30,"g","Sedano","verd"],["Carota",30,"g","Carote","verd"],["Aglio",1,"spicchio","Aglio","verd"],["Alloro",2,"foglia","Alloro","erbe"],["Rosmarino",null,"q.b.","Rosmarino","erbe"],["Olio extravergine",10,"g","Olio extravergine d'oliva","qb"],["Sale e pepe",null,"q.b.","Sale e pepe","qb"]],
   steps:["Metti i fagioli in ammollo la sera prima, per tutta la notte.","Sciacquali, mettili in una pentola con abbondante acqua fredda, aggiungi 2 foglie di alloro e lessali per circa 80 minuti dal bollore. Conserva l'acqua di cottura: serve per il resto della ricetta.","Nel frattempo trita finemente cipolla, sedano e carota.","Scalda l'olio in una casseruola, aggiungi uno spicchio d'aglio sbucciato e le verdure tritate e soffriggi per circa 5 minuti.","Preleva i fagioli con una schiumarola e uniscili al soffritto.","Aggiungi circa 500 g dell'acqua di cottura dei fagioli e mescola bene.","Versa la passata, sala con moderazione, pepa e cuoci per 20 minuti a fiamma moderata.","Preleva due mestoli di fagioli, frullali con il frullatore a immersione e tieni da parte la crema.","Aggiungi i ditaloni direttamente nella pentola, copri con altri 500 g di acqua di cottura dei fagioli e cuoci a fiamma moderata, mescolando di tanto in tanto.","Quando la pasta è al dente unisci la crema di fagioli e il rosmarino tritato, spegni, copri e lascia riposare un paio di minuti.","Completa con pepe nero e servi."],
   side:"Dalla pagina: si conserva un giorno in frigo; la congelazione è sconsigliata."},
  {id:"branzino",day:"ven",dayL:"Venerdì 27",meal:"Cena",title:"Branzino al forno",prot:"pesce",base:2,
   url:"https://ricette.giallozafferano.it/Branzino-al-forno.html",time:"65 minuti",start:"Per cenare alle 20, comincia alle 18:55. Il forno lavora circa 25 minuti, il resto è pulizia del pesce e delle verdure.",
   lact:"Nessun latticino.",
   extra:"Compra il branzino fresco dal pescivendolo e fattelo eviscerare e squamare. Dalla pagina: un branzino da 400 g cuoce a 180 °C per circa 20 minuti.",
   ing:[["Branzino fresco, da circa 800 g",1,"pz","Branzino fresco, da 800 g","pesce"],["Cipolla",1,"pz","Cipolle dorate","verd",150,"g"],["Carote",2,"pz","Carote","verd",200,"g"],["Sedano",3,"coste","Sedano","verd",150,"g"],["Aglio",1,"spicchio","Aglio","verd"],["Alloro",1,"foglia","Alloro","erbe"],["Pomodorini ciliegino",250,"g","Pomodorini ciliegino","verd"],["Prezzemolo",null,"q.b.","Prezzemolo","erbe"],["Basilico, per guarnire",null,"q.b.","Basilico","erbe"],["Olio extravergine, sale, pepe",null,"q.b.","Olio extravergine d'oliva","qb"],["Patate, per il contorno",500,"g","Patate","verd"]],
   steps:["Taglia a pezzi grossolani cipolla, carote e coste di sedano; dividi a metà i pomodorini e sminuzza il prezzemolo.","Disponi le verdure sulla leccarda, ungi, sala e pepa.","Cuoci le verdure in forno statico preriscaldato a 180 °C per circa 10 minuti.","Nel frattempo pulisci il branzino: eviscera, squama facendo scorrere la lama dalla coda verso la testa ed elimina tutte le pinne.","All'interno metti un pizzico di sale, uno spicchio d'aglio e una foglia di alloro.","Sistema il branzino sulla leccarda, ungi la superficie del pesce e cuoci per 15 minuti.","A cottura ultimata profuma con qualche foglia di basilico e servi."],
   side:"Contorno, idea mia: patate a spicchi in un'altra teglia a 180 °C per circa 40 minuti, da infornare prima del pesce. Il fondo di cottura delle verdure si può servire come sugo."},
  {id:"brasato",day:"sab",dayL:"Sabato 28",meal:"Pranzo",title:"Brasato al Barolo",prot:"carne",base:4,
   url:"https://ricette.giallozafferano.it/Brasato-al-Barolo.html",time:"3 ore e 10 minuti, più 8-12 ore di marinatura",start:"Marinatura venerdì sera; sabato comincia verso le 9:50 per pranzare alle 13.",
   lact:"La ricetta rosola la carne in 10 g di burro: usa burro senza lattosio oppure solo olio.",
   extra:"La marinatura non va oltre 24 ore. Consiglio facoltativo dalla pagina: qualche bacca di ginepro nella marinatura, per un aroma più deciso. Il brasato si conserva 2 giorni in frigo coperto di salsa.",
   ing:[["Cappello del prete",1,"kg","Cappello del prete","carne"],["Barolo (o altro rosso corposo), per la marinatura",750,"ml","Barolo","disp"],["Carota, per la marinatura",1,"pz","Carote","verd",100,"g"],["Sedano, per la marinatura",1,"costa","Sedano","verd",50,"g"],["Cipolla dorata, per la marinatura",1,"pz","Cipolle dorate","verd",150,"g"],["Aglio",1,"spicchio","Aglio","verd"],["Rosmarino e salvia",null,"q.b.","Rosmarino e salvia","erbe"],["Chiodi di garofano",null,"q.b.","Chiodi di garofano","disp"],["Cannella in stecche",null,"q.b.","Cannella in stecche","disp"],["Pepe nero in grani",null,"q.b.","Pepe nero in grani","disp"],["Concentrato di pomodoro",1,"cucchiaio","Concentrato di pomodoro","disp"],["Burro senza lattosio",10,"g","Burro senza lattosio","latt"],["Olio extravergine e sale",null,"q.b.","Olio extravergine d'oliva","qb"],["Patate, per il purè",800,"g","Patate","verd"]],
   steps:["Marinatura, venerdì sera: monda e taglia a pezzi carota, sedano e cipolla.","Chiudi la stecca di cannella e i chiodi di garofano in una garza, e lega insieme rosmarino e salvia per fare un mazzetto aromatico.","Pulisci il cappello del prete e mettilo in una ciotola capiente con le verdure, l'aglio e il pepe in grani.","Aggiungi la garza con le spezie e il mazzetto aromatico, copri con il vino rosso, chiudi con pellicola e lascia marinare in frigorifero per 8-12 ore.","Sabato filtra il liquido e tienilo da parte insieme alle verdure. Tampona la carne con carta assorbente.","Fai sciogliere il burro senza lattosio in una casseruola, adagia la carne, sala e rosolala su tutti i lati per 4-5 minuti in tutto. Toglila e aggiungi le verdure.","Irrora con un filo d'olio e rosola le verdure circa 3 minuti, poi rimetti la carne e aggiungi il liquido di marinatura.","Unisci il concentrato di pomodoro, mescola e copri con il coperchio.","Porta a bollore e lascia sobbollire per 2 ore e 20 minuti, girando la carne a metà cottura.","Togli la carne, elimina spezie ed erbe aromatiche e, a fuoco spento, frulla il fondo di cottura con il mixer a immersione.","Alza la fiamma e fai ridurre il fondo della metà, senza coperchio.","Taglia il brasato a fette di circa 1 cm, nappale con la salsa e guarnisci con aghi di rosmarino."],
   side:"Contorno, idea mia: purè di patate con acqua di cottura e olio, oppure con latte senza lattosio."},
  {id:"gnocchi",day:"sab",dayL:"Sabato 28",meal:"Cena",title:"Gnocchi alla sorrentina",prot:"formaggio",base:4,
   url:"https://ricette.giallozafferano.it/Gnocchi-alla-sorrentina.html",time:"70 minuti",start:"Per cenare alle 20, comincia alle 18:50: le patate cuociono 30-40 minuti, e intanto prepari il sugo.",
   lact:"Usa mozzarella senza lattosio. Il Parmigiano è naturalmente privo di lattosio.",
   extra:"È l'unica occasione di formaggio della settimana. Dalla pagina: con la pentola a pressione i tempi di cottura delle patate si riducono.",
   ing:[["Patate rosse",1,"kg","Patate rosse","verd"],["Farina 00",300,"g","Farina 00","disp"],["Uovo",1,"pz","Uova","uova"],["Semola, per spolverare",null,"q.b.","Semola","qb"],["Passata di pomodoro",600,"g","Passata di pomodoro","disp"],["Basilico",6,"foglia","Basilico","erbe"],["Aglio",1,"spicchio","Aglio","verd"],["Mozzarella senza lattosio",250,"g","Mozzarella senza lattosio","latt"],["Parmigiano Reggiano grattugiato",70,"g","Parmigiano Reggiano","latt"],["Olio extravergine e sale",null,"q.b.","Olio extravergine d'oliva","qb"]],
   steps:["Lava le patate, mettile in un tegame capiente con acqua e cuocile per circa 30-40 minuti, fino a quando i rebbi di una forchetta entrano facilmente.","Nel frattempo prepara il sugo: in un tegame versa un filo d'olio, uno spicchio d'aglio sbucciato intero e la passata (600 g), sala.","Insaporisci con le foglie di basilico, copri e cuoci a fiamma medio-bassa per circa 30 minuti.","Quando le patate sono pronte, scolale bene. Setaccia la farina sulla spianatoia e forma una fontana. Schiaccia al centro le patate ancora calde con lo schiacciapatate, oppure pelale e schiacciale.","Aggiungi l'uovo e il sale e impasta rapidamente.","Compatta l'impasto fino a una consistenza omogenea, morbida ma non appiccicosa né troppo tenace, e coprilo con un canovaccio asciutto. Porta a bollore l'acqua per gli gnocchi, salala e preleva man mano una porzione di impasto, tenendo coperto il resto.","Forma dei bigoli spessi 2-3 cm, spolverali con semola e ricava gli gnocchi con un tarocco. Rigali su un rigagnocchi o sui rebbi di una forchetta.","Disponi gli gnocchi su un vassoio coperto da un canovaccio pulito e cosparso di semola. Quando sono tutti pronti, togli l'aglio dal sugo e versane quasi tutto in una ciotola capiente.","Lessa gli gnocchi in 2-3 volte, con l'acqua che frema senza bollire violentemente. Appena salgono a galla scolali con la schiumarola e passali nella ciotola con il sugo, mescolando con delicatezza. Nella pirofila versa sul fondo il sugo restante e irrora con un filo d'olio.","Fai un primo strato di gnocchi, condisci con mozzarella a dadini o sfilacciata e una spolverata di Parmigiano.","Fai un secondo strato con gli gnocchi, poi la mozzarella e il Parmigiano restanti.","Inforna in forno statico preriscaldato a 250 °C in modalità grill per 5 minuti e servi ben caldo."],
   side:""},
  {id:"zuppa",day:"dom",dayL:"Domenica 29",meal:"Pranzo",title:"Zuppa di ceci",prot:"legumi",base:4,
   url:"https://ricette.giallozafferano.it/Zuppa-di-ceci.html",time:"2 ore e 50 minuti, più 8 ore di ammollo",start:"Ceci in ammollo sabato sera; domenica comincia alle 10:10 per pranzare alle 13.",
   lact:"Nessun latticino e nessun salume.",
   extra:"Il timo compare solo nel servizio finale della ricetta e non nell'elenco ingredienti: l'ho messo in lista. Se vuoi accorciare i tempi puoi usare ceci già cotti, ma è una scorciatoia mia, non della ricetta.",
   ing:[["Ceci secchi",300,"g","Ceci secchi","disp"],["Porro",1,"pz","Porri","verd"],["Cipolla bianca",1,"pz","Cipolle bianche","verd",100,"g"],["Carota",1,"pz","Carote","verd",100,"g"],["Sedano",1,"costa","Sedano","verd",50,"g"],["Passata di pomodoro",60,"g","Passata di pomodoro","disp"],["Rosmarino",2,"rametti","Rosmarino","erbe"],["Alloro",2,"foglia","Alloro","erbe"],["Timo, per servire",null,"q.b.","Timo","erbe"],["Olio extravergine",3,"cucchiaio","Olio extravergine d'oliva","qb"],["Sale e pepe nero",null,"q.b.","Sale e pepe","qb"],["Pane, per i crostini",200,"g","Pane","pane"]],
   steps:["Metti i ceci in ammollo in acqua per circa 8 ore o per tutta la notte, poi scolali e sciacquali.","Monda il porro eliminando la base e le foglie più esterne e affettalo a rondelle sottili.","Pela e trita la carota, elimina la base del sedano e tritalo, poi monda e trita la cipolla.","In una casseruola con poco olio versa il trito di verdure, aggiungi un mestolo d'acqua e lascia stufare per 10 minuti a fuoco dolce.","Unisci i ceci, il rosmarino e l'alloro legati insieme con lo spago da cucina e copri con acqua.","Aggiungi la passata (60 g), copri con il coperchio e cuoci per 2 ore e mezzo. A fine cottura sala.","Elimina il mazzetto aromatico e regola sale e pepe. Preleva un mestolo di ceci con un po' della loro acqua e frullali con il frullatore a immersione fino a ottenere una crema.","Versa la crema nel tegame e mescola per amalgamare.","Servi con un giro d'olio extravergine, una macinata di pepe e foglioline di timo."],
   side:"Dalla pagina: ottima con crostini di pane tostato."},
  {id:"carbonara",day:"dom",dayL:"Domenica 29",meal:"Cena",title:"Spaghetti alla carbonara",prot:"uova",base:4,
   url:"https://ricette.giallozafferano.it/Spaghetti-alla-Carbonara.html",time:"25 minuti",start:"Per cenare alle 20, comincia alle 19:35.",
   lact:"Il Pecorino Romano è un formaggio molto stagionato con tracce di lattosio trascurabili; se vuoi essere rigoroso, sostituiscilo con Parmigiano (la pagina propone anche metà e metà). La ricetta esclude la panna.",
   extra:"Il guanciale è l'unico salume della settimana. Dalla pagina: le uova vanno aggiunte solo a fuoco spento, per evitare l'effetto frittata, e il guanciale alla fine, per mantenerlo croccante.",
   ing:[["Spaghetti",320,"g","Spaghetti","pasta"],["Guanciale",150,"g","Guanciale","carne"],["Tuorli",6,"pz","Uova","uova"],["Pecorino Romano grattugiato",50,"g","Pecorino Romano","latt"],["Pepe nero",null,"q.b.","Sale e pepe","qb"],["Sale, per l'acqua della pasta",null,"q.b.","Sale e pepe","qb"]],
   steps:["Porta a bollore una pentola d'acqua salata per la pasta. Elimina la cotenna dal guanciale, taglialo prima a fette e poi a striscioline spesse circa 1 cm.","Metti il guanciale in una padella antiaderente e rosolalo per circa 10 minuti a fiamma medio-alta, senza bruciarlo. Nel frattempo tuffa gli spaghetti nell'acqua bollente e cuocili al dente, e versa i tuorli in una ciotola.","Aggiungi il Pecorino ai tuorli e insaporisci con pepe nero. Amalgama con una frusta fino a ottenere una crema liscia.","Quando il guanciale è cotto, spegni il fuoco, preleva il guanciale con un mestolo lasciando nella padella il fondo di cottura e il grasso, e mettilo da parte in una ciotolina. Versa in padella una mestolata d'acqua di cottura della pasta.","Scola la pasta al dente direttamente nella padella con il fondo di cottura e saltala brevemente. Togli dal fuoco e versa il composto di uova e Pecorino, mescolando velocemente.","Se serve, aggiungi poca acqua di cottura per rendere la crema più cremosa. Unisci il guanciale, mescola un'ultima volta e servi subito, con altro Pecorino e un pizzico di pepe."],
   side:""}
  ];
  
  const DAYS=[
   {k:"lun",t:"Lunedì 23",tag:"",m:[["Pranzo","r","orata"],["Cena","r","lenticchie"]]},
   {k:"mar",t:"Martedì 24",tag:"ufficio",m:[["Pranzo","r","pollo"],["Cena","r","merluzzo"]]},
   {k:"mer",t:"Mercoledì 25",tag:"ufficio e allenamento",m:[["Pranzo","r","falafel"],["19:30","r","frittata"]]},
   {k:"gio",t:"Giovedì 26",tag:"allenamento",m:[["Pranzo","r","vongole"],["19:15","r","risotto"]]},
   {k:"ven",t:"Venerdì 27",tag:"",m:[["Pranzo","r","fagioli"],["Cena","r","branzino"]]},
   {k:"sab",t:"Sabato 28",tag:"",m:[["Pranzo","r","brasato"],["Cena","r","gnocchi"]]},
   {k:"dom",t:"Domenica 29",tag:"",m:[["Pranzo","r","zuppa"],["Cena","r","carbonara"]]}
  ];
  const PROT={pesce:"pesce",legumi:"legumi",carne:"carne",uova:"uova",formaggio:"formaggio",nessuna:"senza proteina principale"};
  const CATS=[["verd","Frutta e verdura"],["pesce","Pesce"],["carne","Carne e salumi"],["uova","Uova"],["latt","Latticini senza lattosio e formaggi stagionati"],["pane","Pane"],["pasta","Pasta e riso"],["disp","Dispensa"],["erbe","Erbe e aromi"],["qb","Da controllare in casa"]];
  const PAGES=["indice","colazione","ufficio"].concat(R.map(r=>r.id)).concat(["spesa"]);
  
  let persone=store.get("persone",2);
  const app=document.getElementById("app");
  const byId=id=>R.find(r=>r.id===id);
  const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  
  function fmtNum(q,u){
    if(q===null)return "";
    if(["g","ml"].includes(u)){const v=q<50?Math.max(5,Math.round(q/5)*5):Math.round(q/10)*10;if(v>=1000)return (v/1000).toLocaleString("it-IT",{maximumFractionDigits:2})+(u==="g"?" kg":" l");return v+" "+u}
    if(u==="l"){return (Math.round(q*20)/20).toLocaleString("it-IT")+" l"}
    if(u==="pz"||u==="cucchiaino"){const h=Math.max(.5,Math.ceil(q*2)/2);const w=Math.floor(h),f=h-w;let s=(w?w:"")+(f?(w?" ½":"½"):"");return u==="pz"?s:s+" "+(h>1?"cucchiaini":"cucchiaino")}
    const n=Math.max(1,Math.ceil(q));
    const pl={spicchio:"spicchi",rametto:"rametti",costa:"coste",ciuffo:"ciuffi",foglia:"foglie",bustina:"bustine",cucchiaio:"cucchiai",mazzetto:"mazzetti",goccia:"gocce",pizzico:"pizzichi"};
    return n+" "+(n>1&&pl[u]?pl[u]:u);
  }
  function fmtIng(i,f){const [n,q,u]=i;if(q===null)return "q.b.";const k=q*f;if(n==="Uova"||n==="Uovo")return Math.max(1,Math.ceil(k))+"";if(u==="g"&&/Lievito/.test(n))return (Math.round(k*10)/10).toLocaleString("it-IT")+" g";return fmtNum(k,u)}
  
  function protPill(p){return `<span class="pill p-${p}">${PROT[p]}</span>`}
  
  function renderIndice(){
    const rot=["-1.2deg",".8deg","-.5deg","1.1deg","-.9deg",".6deg","-1deg"];
    let h=`<section class="page"><div class="cover"><p class="eyebrow">Settimana dal 23 al 29 novembre · Milano</p><h1>Il quaderno della settimana</h1>
    <p class="lead">Tocca un piatto per aprire la ricetta passo passo, con gli ingredienti da spuntare e il link alla pagina originale. Tutto è senza lattosio; le dosi seguono il numero di persone scelto in alto. Martedì e mercoledì sei in ufficio, mercoledì e giovedì ti alleni: nella pagina dedicata trovi come organizzare le sere.</p></div><div class="days">`;
    DAYS.forEach((d,i)=>{
      h+=`<article class="day" style="--r:${rot[i]}"><h3>${d.t}${d.tag?`<span class="tag">${d.tag}</span>`:""}</h3>`;
      d.m.forEach(([w,t,v])=>{
        const r=byId(v);h+=`<div class="meal"><span class="when">${w}</span><div><button class="go" data-go="${r.id}">${esc(r.title)}</button>${protPill(r.prot)}</div></div>`;
      });
      h+=`</article>`;
    });
    h+=`</div><div class="extra"><button class="btn" data-go="colazione">Colazioni e spuntini</button><button class="btn" data-go="ufficio">Ufficio e allenamento</button><button class="btn" data-go="spesa">Lista della spesa</button><a class="btn" href="archivio/quaderno-16-22-novembre.html" style="text-decoration:none;color:inherit">Quaderno della settimana scorsa</a></div>
    <div class="sheet" style="margin-top:26px"><h3>Il conto delle proteine</h3><div class="tally">
    <div><b>4</b><span>pesce fresco, mai in scatola</span></div><div><b>4</b><span>legumi</span></div><div><b>2</b><span>carne</span></div><div><b>2</b><span>uova</span></div><div><b>1</b><span>formaggio, gli gnocchi</span></div><div><b>1</b><span>salume, il guanciale della carbonara</span></div></div>
    <p class="side" style="color:var(--ink-2)">Il risotto di giovedì resta di proposito senza una proteina principale. Parmigiano, Grana e Pecorino grattugiati li conto come condimento. Nessun fungo a parte i finferli, nessun cavolo nero.</p></div></section>`;
    return h;
  }
  
  function renderColazione(){
    return `<section class="page prose"><p class="eyebrow">Ogni mattina</p><h2>Colazioni e spuntini</h2>
    <p>Il punto fisso è un cappuccino con bevanda vegetale senza zuccheri aggiunti, riducendo piano piano lo zucchero. Accanto, a rotazione nei sette giorni, una di queste:</p>
    <div class="sheet"><label class="chk"><input type="checkbox" data-k="col-1"><span>Biscotti con un po' di frutta secca e un frutto</span></label>
    <label class="chk"><input type="checkbox" data-k="col-2"><span>Porridge d'avena con frutta</span></label>
    <label class="chk"><input type="checkbox" data-k="col-3"><span>Pane integrale e marmellata</span></label>
    <label class="chk"><input type="checkbox" data-k="col-4"><span>Cereali soffiati con frutta</span></label>
    <label class="chk"><input type="checkbox" data-k="col-5"><span>Pancake integrali con yogurt intero senza lattosio</span></label></div>
    <p>La frutta di stagione a fine novembre: mele, pere, cachi, mandarini, clementine e kiwi.</p>
    <h3>Prima dell'allenamento</h3>
    <p>Mercoledì e giovedì ti alleni dalle 21 alle 23 e mangi tutto prima, senza cena dopo: il pasto della sera è già quello pre allenamento, da finire entro le 20:00 circa. Se verso le 20:20 hai ancora fame, una banana o una fetta di pane con miele, mezz'ora prima di iniziare.</p>
    <div class="pager"><button class="btn" data-go="indice">← La settimana</button><button class="btn" data-go="ufficio">Ufficio e allenamento →</button></div></section>`;
  }
  
  function renderUfficio(){
    return `<section class="page prose"><p class="eyebrow">Martedì e mercoledì in ufficio, mercoledì e giovedì allenamento</p><h2>Ufficio e allenamento</h2>
    <p>In ufficio i pranzi sono già pronti la sera prima, così a mezzogiorno non cucini nulla. Il lavoro vero si concentra in tre serate, e conviene guardarle insieme.</p>
    <div class="sheet"><h3>Lunedì sera</h3><p class="side">Dopo la pasta e lenticchie: cucina il pollo al curry (circa 70 minuti) e mettilo nel contenitore per martedì. Metti anche in ammollo i 500 g di ceci secchi dei felafel, che devono stare a bagno 24 ore.</p></div>
    <div class="sheet"><h3>Martedì sera</h3><p class="side">Il merluzzo cuoce in forno circa mezz'ora e ti lascia le mani libere: in quel tempo impasta e friggi i felafel, prepara hummus e salsa allo yogurt senza lattosio, e cuoci la frittata di spinaci per mercoledì sera. Sono tre cose in una serata, ma una sola pentola alla volta.</p></div>
    <div class="sheet"><h3>Mercoledì</h3><p class="side">A pranzo in ufficio i felafel, freddi o scaldati, con hummus e salsa in contenitori separati. A casa, verso le 19:30, la frittata scaldata cinque minuti in padella coperta, con pane integrale o patate al forno. Finisci verso le 20:00 e hai un'ora piena prima di iniziare.</p></div>
    <div class="sheet"><h3>Giovedì</h3><p class="side">Sei a casa. Le vongole vanno a spurgare verso le 10 e le cucini per le 13. Per la sera il risotto ai finferli parte alle 18:40 e si mangia alle 19:15. Giovedì sera metti anche in ammollo i borlotti per la pasta e fagioli di venerdì.</p></div>
    <div class="sheet"><h3>Venerdì e sabato sera</h3><p class="side">Venerdì sera prepara la marinatura del brasato (8-12 ore in frigo). Sabato sera metti in ammollo i ceci per la zuppa di domenica.</p></div>
    <div class="note warn"><strong>Allenamento dalle 21 alle 23:</strong> mercoledì e giovedì mangi tutto prima. Se un giorno rientri tardi, la frittata e il pane si riducono a una cena da venti minuti senza cucinare nulla.</div>
    <div class="pager"><button class="btn" data-go="colazione">← Colazioni</button><button class="btn" data-go="orata">Lunedì a pranzo →</button></div></section>`;
  }
  
  function renderRicetta(r){
    const f=persone/r.base;
    const idx=PAGES.indexOf(r.id),prev=PAGES[idx-1],next=PAGES[idx+1];
    const label=p=>p==="indice"?"La settimana":p==="spesa"?"Lista della spesa":p==="ufficio"?"Ufficio e allenamento":p==="colazione"?"Colazioni":byId(p).title;
    let h=`<section class="page"><div class="rhead"><p class="eyebrow">${r.dayL} · ${r.meal}</p><h1>${esc(r.title)}</h1>
    <div class="meta"><span>Tempo: <b>${r.time}</b></span><span>${protPill(r.prot)}</span><a class="src" href="${r.url}" target="_blank" rel="noopener">Ricetta originale su GialloZafferano ↗</a></div>
    <p>${r.start}</p></div>
    <div class="note"><strong>Senza lattosio.</strong> ${r.lact}</div>${r.extra?`<div class="note warn">${r.extra}</div>`:""}
    <div class="cols"><div class="ing"><h3>Ingredienti</h3><p class="sub">Dosi per ${persone} ${persone>1?"persone":"persona"}, ricalcolate dalla ricetta per ${r.base}.</p>`;
    r.ing.forEach((i,n)=>{h+=`<label class="chk"><input type="checkbox" data-k="${r.id}-i${n}"><span><span class="qty">${fmtIng(i,f)}</span> ${esc(i[0])}</span></label>`});
    h+=`</div><div class="steps"><h3>Procedimento</h3><div class="progress" aria-hidden="true"><i id="bar-${r.id}"></i></div><p class="plabel" id="pl-${r.id}"></p><ol>`;
    r.steps.forEach((s,n)=>{h+=`<li class="step" data-step="${r.id}-s${n}" tabindex="0" role="checkbox" aria-checked="false"><p>${esc(s)}</p></li>`});
    h+=`</ol><p class="side" style="font-size:.85rem;color:var(--ink-2)">Tocca un passaggio quando l'hai fatto. Le quantità nei passaggi sono quelle della ricetta originale.</p><div style="margin-top:6px"><button class="ghost" data-reset="${r.id}">Ricomincia da capo</button></div>${r.side?`<div class="note warn" style="margin-top:14px">${r.side}</div>`:""}</div></div>
    <div class="pager"><button class="btn" data-go="${prev}">← ${esc(label(prev))}</button><button class="btn" data-go="${next}">${esc(label(next))} →</button></div></section>`;
    return h;
  }
  
  function aggregate(list){
    const m=new Map();
    list.forEach(r=>{const f=persone/r.base;r.ing.forEach(i=>{
      const [n,q,u,key,cat,sq,su]=i; if(cat==="none")return;
      const qq=sq!=null?sq:q, uu=su!=null?su:u;
      const id=cat+"|"+key;
      if(!m.has(id))m.set(id,{key,cat,units:{},days:new Set(),qb:false});
      const e=m.get(id); e.days.add(r.day);
      if(qq===null||cat==="qb"){e.qb=true;return}
      e.units[uu]=(e.units[uu]||0)+qq*f;
    })});
    return m;
  }
  function renderSpesa(){
    const dl={lun:"lun",mar:"mar",mer:"mer",gio:"gio",ven:"ven",sab:"sab",dom:"dom"};
    const groups=[["Prima di lunedì","Per i pasti di lunedì, martedì e mercoledì. I ceci secchi dei felafel vanno in ammollo lunedì sera. Orata e merluzzo compratili freschi lunedì mattina e martedì.",R.filter(r=>["lun","mar","mer"].includes(r.day)),"g1"],["Per giovedì e venerdì","Le vongole comprale giovedì mattina; i borlotti secchi vanno in ammollo giovedì sera. I finferli freschi a fine novembre sono rari: vanno bene anche surgelati. Il branzino prendilo venerdì.",R.filter(r=>["gio","ven"].includes(r.day)),"g2"],["Per il fine settimana","Cappello del prete e vino per il brasato entro venerdì, perché la marinatura parte venerdì sera. I ceci della zuppa vanno in ammollo sabato sera.",R.filter(r=>["sab","dom"].includes(r.day)),"g3"]];
    let h=`<section class="page"><p class="eyebrow">Ultima pagina</p><h1>Lista della spesa</h1><p class="lead">Quantità per ${persone} ${persone>1?"persone":"persona"}, sommate da tutte le ricette e arrotondate. Accanto a ogni voce i giorni in cui serve.</p><div class="shop">`;
    groups.forEach(([t,s,list,gk])=>{
      const m=aggregate(list);
      h+=`<div class="shopgrp"><h3>${t}</h3><p class="sub" style="margin:0">${s}</p>`;
      CATS.forEach(([c,cl])=>{
        const items=[...m.values()].filter(e=>e.cat===c).sort((a,b)=>a.key.localeCompare(b.key,"it"));
        if(!items.length)return;
        h+=`<p class="cat">${cl}</p>`;
        items.forEach(e=>{
          const amt=Object.entries(e.units).map(([u,q])=>e.key==="Uova"?Math.ceil(q)+"":fmtNum(q,u)).join(" + ");
          const days=[...e.days].map(d=>dl[d]).join(", ");
          h+=`<label class="chk"><input type="checkbox" data-k="spesa-${gk}-${esc(e.cat+e.key)}"><span>${esc(e.key)}${amt?` <span class="qty">${amt}</span>`:""}<span class="days-small">${days}</span></span></label>`;
        });
      });
      h+=`</div>`;
    });
    h+=`<div class="shopgrp"><h3>Colazioni e spuntini</h3><p class="sub" style="margin:0">Per tutta la settimana, nelle quantità che usi di solito.</p>`;
    ["Bevanda vegetale senza zuccheri aggiunti","Yogurt intero senza lattosio","Fiocchi d'avena","Biscotti","Frutta secca","Pane integrale","Marmellata","Miele","Cereali soffiati","Farina integrale per i pancake","Mele, pere, cachi, mandarini e kiwi"].forEach((x,n)=>{h+=`<label class="chk"><input type="checkbox" data-k="spesa-col-${n}"><span>${x}</span></label>`});
    h+=`</div></div><div class="pager"><button class="btn" data-go="carbonara">← Spaghetti alla carbonara</button><button class="btn" data-go="indice">Torna alla settimana</button></div><div style="margin-top:12px"><button class="ghost" data-resetshop="1">Togli tutte le spunte della spesa</button></div></section>`;
    return h;
  }
  
  function updateProgress(id){
    const steps=[...app.querySelectorAll(`[data-step^="${id}-s"]`)];
    const done=steps.filter(s=>s.classList.contains("done")).length;
    const bar=document.getElementById("bar-"+id),pl=document.getElementById("pl-"+id);
    if(bar)bar.style.width=(steps.length?done/steps.length*100:0)+"%";
    if(pl)pl.textContent=done===steps.length?`Fatto: ${done} passaggi su ${steps.length}. Buon appetito.`:`${done} passaggi su ${steps.length}`;
  }
  
  function show(p){
    if(!PAGES.includes(p))p="indice";
    let h;
    if(p==="indice")h=renderIndice();else if(p==="colazione")h=renderColazione();else if(p==="ufficio")h=renderUfficio();else if(p==="spesa")h=renderSpesa();else h=renderRicetta(byId(p));
    app.innerHTML=h;
    app.querySelectorAll("input[data-k]").forEach(c=>{c.checked=!!store.get("c:"+c.dataset.k,false)});
    app.querySelectorAll("[data-step]").forEach(s=>{const d=!!store.get("c:"+s.dataset.step,false);s.classList.toggle("done",d);s.setAttribute("aria-checked",d)});
    const r=byId(p); if(r)updateProgress(r.id);
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.go===p?"true":"false"));
    store.set("page",p); current=p;
    window.scrollTo({top:0});
  }
  let current="indice";
  
  document.addEventListener("click",e=>{
    const g=e.target.closest("[data-go]"); if(g){show(g.dataset.go);return}
    const pb=e.target.closest("[data-p]"); if(pb){persone=+pb.dataset.p;store.set("persone",persone);document.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed",b===pb?"true":"false"));show(current);return}
    const st=e.target.closest("[data-step]"); if(st){toggleStep(st);return}
    const rs=e.target.closest("[data-reset]"); if(rs){const id=rs.dataset.reset;const r=byId(id);r.steps.forEach((_,n)=>store.set("c:"+id+"-s"+n,false));r.ing.forEach((_,n)=>store.set("c:"+id+"-i"+n,false));show(id);return}
    const rsp=e.target.closest("[data-resetshop]"); if(rsp){app.querySelectorAll('input[data-k^="spesa-"]').forEach(c=>{c.checked=false;store.set("c:"+c.dataset.k,false)});return}
  });
  document.addEventListener("change",e=>{const c=e.target.closest("input[data-k]");if(c)store.set("c:"+c.dataset.k,c.checked)});
  document.addEventListener("keydown",e=>{const st=e.target.closest&&e.target.closest("[data-step]");if(st&&(e.key===" "||e.key==="Enter")){e.preventDefault();toggleStep(st)}});
  function toggleStep(st){const d=!st.classList.contains("done");st.classList.toggle("done",d);st.setAttribute("aria-checked",d);store.set("c:"+st.dataset.step,d);updateProgress(st.dataset.step.split("-s")[0])}
  
  document.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.p===persone?"true":"false"));
  show(store.get("page","indice"));
  })();
  </script>
